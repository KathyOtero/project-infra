server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea un archivo real cae en index.html para
    # que react-router-dom (BrowserRouter) maneje el enrutamiento en el
    # cliente. Sin esto, refrescar /experiencias/5 daria 404 en nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reenvia las llamadas a la API al contenedor del backend (mismo patron
    # que el proxy de Vite en desarrollo, pero resuelto por Docker Compose
    # usando el nombre del servicio "backend" en la red interna).
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache agresivo para assets con hash en el nombre (generados por Vite);
    # el HTML nunca se cachea para que los usuarios siempre reciban el build
    # mas reciente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
