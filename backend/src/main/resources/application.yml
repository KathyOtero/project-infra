spring:
  application:
    name: caribexperience-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/caribexperience?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:caribe_user}
    password: ${DB_PASSWORD:caribe_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Pool conservador pensado para correr detras de un ALB con multiples
      # instancias EC2: evita agotar conexiones de RDS cuando escala el ASG.
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
      # Flyway es la unica fuente de verdad del esquema; Hibernate solo valida
      # que las entidades coincidan con las tablas migradas (nunca las crea).
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  # Permite que Spring confie en los headers X-Forwarded-* que agrega el ALB
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Necesario para los Health Checks del Application Load Balancer / ASG
      show-details: when-authorized
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:cambiar-este-secreto-en-produccion-min-256-bits-xxxxxxxxxx}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 horas
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.caribexperience: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
