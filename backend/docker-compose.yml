services:
  mysql:
    image: mysql:8.0
    container_name: caribexperience-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: caribexperience
      MYSQL_USER: caribe_user
      MYSQL_PASSWORD: caribe_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3306:3306"
    volumes:
      - caribexperience_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_pass"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - caribexperience_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caribexperience-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # El backend se conecta a MySQL usando el nombre del servicio ("mysql")
      # en vez de "localhost", ya que ambos contenedores comparten la red
      # interna de docker-compose.
      DB_URL: jdbc:mysql://mysql:3306/caribexperience?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: caribe_user
      DB_PASSWORD: caribe_pass
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:-cambiar-este-secreto-en-produccion-min-256-bits-xxxxxxxxxx}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8082}
    ports:
      - "8080:8080"
    networks:
      - caribexperience_net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: caribexperience-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8082:80"
    networks:
      - caribexperience_net

networks:
  caribexperience_net:
    driver: bridge

volumes:
  caribexperience_mysql_data:
