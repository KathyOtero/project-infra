name: Validate CaribeXperience
on:
  push:
    branches: [main, mejoras-andres]
  pull_request:
    branches: [main, mejoras-andres]
permissions:
  contents: read
jobs:
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Validate root, bootstrap and offline architecture tests
        run: |
          terraform fmt -check -recursive terraform
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate
          terraform -chdir=terraform test
          terraform -chdir=terraform/bootstrap init -backend=false -input=false
          terraform -chdir=terraform/bootstrap validate
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.55.1
      - run: tflint --chdir=terraform --init && tflint --chdir=terraform --recursive
  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install ansible-core==2.18.6 boto3
          ansible-galaxy collection install -r ansible/requirements.yml
          ANSIBLE_CONFIG=ansible/ansible.cfg ansible-playbook -i localhost, -c local ansible/site.yml --syntax-check
          python -m compileall -q ansible/roles/deploy/files .github/scripts
          python -m unittest discover -s tests -v
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B -f backend/pom.xml verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend && npm run lint --prefix frontend && npm run build --prefix frontend
