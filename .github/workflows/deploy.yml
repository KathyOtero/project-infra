name: Manual deployment
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: caribexperience-dev-infrastructure
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: aws-dev
    env:
      AWS_REGION: us-east-1
      TF_VAR_backend_release: ${{ github.sha }}
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate sources before mutations
        run: |
          terraform -chdir=terraform init -input=false
          terraform -chdir=terraform fmt -check -recursive
          terraform -chdir=terraform validate
          pip install ansible-core==2.18.6 boto3
          ansible-galaxy collection install -r ansible/requirements.yml
          ansible-playbook -i localhost, -c local ansible/site.yml --syntax-check
          npm ci --prefix frontend
          npm run lint --prefix frontend
          npm run build --prefix frontend
      - name: Test backend including MySQL integration
        run: |
          docker run --rm -v "$PWD/backend:/app" -w /app -v /var/run/docker.sock:/var/run/docker.sock -e TESTCONTAINERS_HOST_OVERRIDE=host.docker.internal --add-host=host.docker.internal:host-gateway maven:3.9-eclipse-temurin-17 mvn -B verify
      - name: Prepare artifact stores only (first deployment)
        run: |
          terraform -chdir=terraform plan -input=false -out=prepare.tfplan -target=aws_ecr_repository.backend -target=aws_s3_bucket.artifacts -target=aws_s3_bucket_versioning.artifacts -target=aws_s3_bucket_public_access_block.application -target=aws_s3_bucket_server_side_encryption_configuration.application -target=aws_secretsmanager_secret.jwt
          terraform -chdir=terraform apply -input=false prepare.tfplan
      - name: Publish immutable release before starting instances
        run: |
          REPOSITORY=$(terraform -chdir=terraform output -raw ecr_repository_url)
          BUCKET=$(terraform -chdir=terraform output -raw artifacts_bucket)
          JWT_SECRET_ARN=$(aws secretsmanager describe-secret --secret-id caribexperience-dev/jwt --query ARN --output text)
          export JWT_SECRET_ARN
          python .github/scripts/seed_jwt.py
          aws ecr get-login-password | docker login --username AWS --password-stdin "${REPOSITORY%%/*}"
          if ! aws ecr describe-images --repository-name caribexperience-dev-backend --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            docker build -t "$REPOSITORY:$GITHUB_SHA" backend
            docker push "$REPOSITORY:$GITHUB_SHA"
          fi
          tar -czf /tmp/ansible.tar.gz ansible
          aws s3 cp /tmp/ansible.tar.gz "s3://$BUCKET/releases/$GITHUB_SHA/ansible.tar.gz"
      - name: Plan and apply full architecture
        run: |
          terraform -chdir=terraform plan -input=false -out=deploy.tfplan
          terraform -chdir=terraform apply -input=false deploy.tfplan
          terraform -chdir=terraform output -json deploy_config > /tmp/deploy-config.json
          printf '%s\n' \
            "ANSIBLE_SSM_BUCKET=$(terraform -chdir=terraform output -raw ssm_bucket)" \
            "ASG_NAME=$(terraform -chdir=terraform output -raw autoscaling_group_name)" \
            "TARGET_GROUP_ARN=$(terraform -chdir=terraform output -raw target_group_arn)" >> "$GITHUB_ENV"
      - name: Install Session Manager client
        run: |
          curl --fail --location https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb -o /tmp/ssm.deb
          sudo dpkg -i /tmp/ssm.deb
      - name: Wait for Auto Scaling health and rolling refresh
        run: python .github/scripts/wait_for_asg.py
      - name: Configure private instances through SSM
        run: |
          ansible-inventory -i ansible/aws_ec2.yml --list > /tmp/inventory.json
          python -c "import json; d=json.load(open('/tmp/inventory.json')); assert len(d['_meta']['hostvars']) >= 2, 'Inventory must contain at least two backend instances'"
          ansible-playbook -i ansible/aws_ec2.yml ansible/site.yml -e @/tmp/deploy-config.json
      - name: Publish frontend and verify API
        run: |
          BUCKET=$(terraform -chdir=terraform output -raw frontend_bucket)
          aws s3 sync frontend/dist "s3://$BUCKET" --exclude index.html --cache-control 'public,max-age=31536000,immutable'
          aws s3 cp frontend/dist/index.html "s3://$BUCKET/index.html" --cache-control 'no-cache'
          aws cloudfront create-invalidation --distribution-id "$(terraform -chdir=terraform output -raw cloudfront_id)" --paths '/*'
          URL=$(terraform -chdir=terraform output -raw frontend_url)
          curl --fail --retry 10 --retry-all-errors --retry-delay 15 "$URL/api/catalogos/ciudades"
