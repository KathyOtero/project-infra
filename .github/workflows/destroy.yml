name: Manual Terraform destroy
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DESTROY caribexperience-dev'
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: caribexperience-dev-infrastructure
  cancel-in-progress: false
jobs:
  destroy:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DESTROY caribexperience-dev'
    runs-on: ubuntu-latest
    environment: aws-dev
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: |
          terraform -chdir=terraform init -input=false
          terraform -chdir=terraform plan -destroy -input=false -out=destroy.tfplan
          terraform -chdir=terraform apply -input=false destroy.tfplan
# RDS deletion protection and nonempty buckets intentionally stop destruction.
# Disable protection deliberately and archive/empty project buckets first.
# Never run account-wide orphan cleanup or ignore Terraform errors.
